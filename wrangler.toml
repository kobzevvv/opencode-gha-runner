name = "opencode-gha-runner-gateway"
account_id = "d740a05e9442c1d0feacae2dfc673e93"
main = "dist/src/worker.js"
compatibility_date = "2024-12-30"
workers_dev = true

# KV держит раны между `launch` и `result`. TTL задан в коде (RUN_TTL_SECONDS),
# потому что Cloudflare KV не умеет применять TTL при каждой записи.
[[kv_namespaces]]
binding = "RUNS"
id = "c1eb5647663b429f8f1e913b5353bd55"

# Секреты задаются через `wrangler secret put`, а не в этом файле:
#   wrangler secret put WORKER_TOKEN
#   wrangler secret put GITHUB_TOKEN
# Клиентские ключи изолируются по именам раннера:
#   WORKER_CLIENT_TOKEN_<CLIENT_ID> (например WORKER_CLIENT_TOKEN_SANDBOX3_AGENT_API)
# Переменные (не секреты) — в wrangler.toml или через `wrangler secret put`:
#   GITHUB_REPO       owner/name репозитория с workflow
#   GITHUB_WORKFLOW   run-agent.yml
#   GITHUB_REF        ветка (по умолчанию дефолтная ветка репозитория)
#   PUBLIC_BASE_URL   публичный адрес шлюза; попадает в pollUrl и reportUrl
#   AGENT_BINARY      бинарь агента в джобе (по умолчанию opencode)
[vars]
GITHUB_REPO = "vovalikessmoothy-png/opencode-gha-runner"
GITHUB_WORKFLOW = "run-agent.yml"
PUBLIC_BASE_URL = "https://opencode-gha-runner-gateway.skillset-apply.workers.dev"
AGENT_BINARY = "opencode"

# Изолированный компонентный sandbox. Не подключён к Telegram или Agent API.
[env.sandbox]
name = "opencode-gha-runner-gateway-sandbox"
workers_dev = true

[[env.sandbox.kv_namespaces]]
binding = "RUNS"
id = "136ea015f1384cd0a84e021dd1dc4902"

[[env.sandbox.d1_databases]]
binding = "RUN_DB"
database_name = "opencode-gha-runner-gateway-sandbox-state"
database_id = "a9689eee-3757-46a7-a341-246e38c679b5"
migrations_dir = "migrations"

[env.sandbox.vars]
GITHUB_REPO = "vovalikessmoothy-png/opencode-gha-runner"
GITHUB_WORKFLOW = "run-agent-sandbox.yml"
GITHUB_REF = "main"
PUBLIC_BASE_URL = "https://opencode-gha-runner-gateway-sandbox.skillset-apply.workers.dev"
AGENT_BINARY = "opencode"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[env.sandbox.triggers]
crons = ["*/5 * * * *"]
